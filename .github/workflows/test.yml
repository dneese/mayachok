name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Worker tests
        run: node --test worker/position.test.mjs
      - name: Web syntax
        run: |
          node --check web/app.js
          node --check web/core.js
      - name: Embedded assets
        run: node scripts/embed-web.mjs > /tmp/mayachok-web-assets.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android compile
        run: |
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          PLATFORM=$(ls -1d "$ANDROID_HOME"/platforms/android-3[4-9]/ 2>/dev/null | sort -V | tail -1)
          export AAPT2="$BT/aapt2"
          export D8="$BT/d8"
          export APKSIGNER="$BT/apksigner"
          export ANDROID_JAR="$PLATFORM/android.jar"
          export MAYACHOK_SKIP_SIGN=1
          bash app/build.sh
